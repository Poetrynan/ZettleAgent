<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="940" viewBox="0 0 1480 940" role="img" aria-label="Spatial reasoning canvas with four note cards, a floating toolbar and the Agent's spatial goals">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1d1d1f; }
      .t2 { fill: #5c5c61; } .t3 { fill: #8e8e93; } .acc { fill: #007aff; } .b { font-weight: 600; } .bb { font-weight: 700; }
      .disp { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .hair { stroke: rgba(0,0,0,0.1); stroke-width: 1; fill: none; }
      .ico { fill: none; stroke: #5c5c61; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="win" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.15"/></filter>
    <filter id="card" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.1"/></filter>
    <filter id="ctl" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.7" flood-color="#000" flood-opacity="0.18"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(0,0,0,0.1)"/></pattern>
  </defs>

  <g filter="url(#win)"><rect x="30" y="24" width="1420" height="880" rx="14" fill="#ffffff"/></g>
  <rect x="30" y="24" width="1420" height="880" rx="14" fill="url(#dots)"/>
  <rect x="30.5" y="24.5" width="1419" height="879" rx="14" class="hair"/>
  <rect x="30" y="24" width="1420" height="46" rx="14" fill="rgba(245,245,247,0.94)"/><rect x="30" y="54" width="1420" height="16" fill="rgba(245,245,247,0.94)"/>
  <path d="M30 70h1420" class="hair"/>
  <circle cx="54" cy="47" r="6.5" fill="#ff5f57"/><circle cx="76" cy="47" r="6.5" fill="#febc2e"/><circle cx="98" cy="47" r="6.5" fill="#28c840"/>
  <text x="740" y="52" text-anchor="middle" font-size="13.5" class="bb">Canvas · Concept Map</text>

  <!-- Floating toolbar -->
  <g filter="url(#card)"><rect x="470" y="88" width="420" height="40" rx="20" fill="rgba(252,252,253,0.94)"/></g>
  <g transform="translate(486 98)">
    <path d="M6 3h8l4 4v12H6z" class="ico"/><path d="M34 4h14v14H34z" class="ico"/><path d="M62 18l6-14 6 14M64.5 13h7" class="ico"/>
    <circle cx="96" cy="11" r="6.5" class="ico"/><path d="M122 6l12 10M122 16l12-10" class="ico"/>
    <path d="M150 2v18" class="hair"/>
  </g>
  <rect x="650" y="96" width="112" height="24" rx="12" fill="rgba(0,122,255,0.1)"/><text x="706" y="112" text-anchor="middle" font-size="12" class="b acc">Auto layout</text>
  <rect x="770" y="96" width="108" height="24" rx="12" fill="#007aff"/><text x="824" y="112" text-anchor="middle" font-size="12" class="b" style="fill:#fff">Discuss board</text>

  <!-- Edges -->
  <g fill="none" stroke="#b8b8bd" stroke-width="1.8" stroke-linecap="round">
    <path d="M420 260 C470 260 480 260 520 260" stroke-dasharray="6 6" stroke="#ff9500"/>
    <path d="M280 330 C280 400 280 430 280 480"/>
    <path d="M660 330 C660 400 660 430 660 480" stroke="#af52de"/>
    <path d="M420 560 C470 560 480 560 520 560"/>
  </g>
  <text x="430" y="248" font-size="11.5" style="fill:#c26a00">contrasts</text>

  <!-- Cards -->
  <g font-size="13">
    <g filter="url(#card)"><rect x="140" y="190" width="280" height="140" rx="14" fill="#fff"/></g>
    <rect x="140" y="190" width="280" height="140" rx="14" fill="none" stroke="#007aff" stroke-width="2"/>
    <rect x="158" y="206" width="60" height="20" rx="10" fill="rgba(0,122,255,0.12)"/><text x="170" y="220" font-size="11" class="b acc">Explain</text>
    <text x="158" y="250" font-size="15" class="b">Principle breakdown</text>
    <text x="158" y="272" class="t2">Splits a broad idea into atomic</text>
    <text x="158" y="290" class="t2">cards with verifiable citations.</text>
    <text x="158" y="316" font-size="12" class="acc">[[Zettelkasten]]</text>

    <g filter="url(#card)"><rect x="520" y="190" width="280" height="140" rx="14" fill="#fff"/></g>
    <rect x="538" y="206" width="70" height="20" rx="10" fill="rgba(232,137,12,0.14)"/><text x="549" y="220" font-size="11" class="b" style="fill:#b35a00">Compare</text>
    <text x="538" y="250" font-size="15" class="b">Local Agent vs cloud SaaS</text>
    <text x="538" y="272" class="t2">Data you own on disk versus</text>
    <text x="538" y="290" class="t2">a closed cloud database.</text>
    <text x="538" y="316" font-size="12" class="acc">[[Data Sovereignty]]</text>

    <g filter="url(#card)"><rect x="140" y="480" width="280" height="140" rx="14" fill="#fff"/></g>
    <rect x="158" y="496" width="54" height="20" rx="10" fill="rgba(40,167,69,0.14)"/><text x="169" y="510" font-size="11" class="b" style="fill:#1a7f3a">Trace</text>
    <text x="158" y="540" font-size="15" class="b">Causal lineage</text>
    <text x="158" y="562" class="t2">From Luhmann's 90,000 paper</text>
    <text x="158" y="580" class="t2">cards to a digital Agent.</text>
    <text x="158" y="606" font-size="12" class="acc">[[Niklas Luhmann]]</text>

    <g filter="url(#card)"><rect x="520" y="480" width="280" height="140" rx="14" fill="#fff"/></g>
    <rect x="538" y="496" width="62" height="20" rx="10" fill="rgba(175,82,222,0.14)"/><text x="549" y="510" font-size="11" class="b" style="fill:#8e3bbf">Cluster</text>
    <text x="538" y="540" font-size="15" class="b">Thematic topology</text>
    <text x="538" y="562" class="t2">Louvain communities and</text>
    <text x="538" y="580" class="t2">PageRank weight the map.</text>
    <text x="538" y="606" font-size="12" class="acc">[[Graph Theory]]</text>
  </g>

  <!-- Sticky note -->
  <g filter="url(#card)"><rect x="840" y="560" width="190" height="120" rx="14" fill="#fff4c2"/></g>
  <text x="858" y="594" font-size="14" class="b">Open question</text>
  <text x="858" y="618" font-size="13" class="t2">Where does the Agent's</text>
  <text x="858" y="636" font-size="13" class="t2">evidence end?</text>

  <!-- Goals popover -->
  <g filter="url(#card)"><rect x="1080" y="150" width="340" height="320" rx="14" fill="rgba(252,252,253,0.96)"/></g>
  <rect x="1080.5" y="150.5" width="339" height="319" rx="14" class="hair"/>
  <path d="M1106 176l2.2 5.5 5.5 2.2-5.5 2.2-2.2 5.5-2.2-5.5-5.5-2.2 5.5-2.2z" fill="#007aff"/>
  <text x="1124" y="190" font-size="17" class="disp bb">Spatial goals</text>
  <text x="1100" y="218" font-size="13" class="t2">The Agent arranges ideas on the board,</text>
  <text x="1100" y="236" font-size="13" class="t2">not just text in a reply.</text>
  <rect x="1100" y="254" width="300" height="64" rx="16" fill="#ebebee"/>
  <g filter="url(#ctl)"><rect x="1102" y="256" width="148" height="28" rx="14" fill="#fff"/></g>
  <text x="1176" y="275" text-anchor="middle" font-size="12.5" class="b">Explain</text>
  <text x="1325" y="275" text-anchor="middle" font-size="12.5">Compare</text>
  <text x="1176" y="307" text-anchor="middle" font-size="12.5">Trace</text>
  <text x="1325" y="307" text-anchor="middle" font-size="12.5">Cluster</text>
  <rect x="1100" y="336" width="300" height="114" rx="12" fill="#f5f5f7"/>
  <text x="1116" y="364" font-size="13" class="b">Two-way sync with your notes</text>
  <text x="1116" y="386" font-size="12.5" class="t2">Editing a card updates the note;</text>
  <text x="1116" y="404" font-size="12.5" class="t2">editing the note resizes the card.</text>
  <text x="1116" y="428" font-size="12" class="t3">Obsidian .canvas compatible</text>

  <!-- Controls + minimap -->
  <g filter="url(#card)"><rect x="56" y="846" width="214" height="36" rx="18" fill="rgba(252,252,253,0.94)"/></g>
  <path d="M74 864h12" class="ico"/><text x="96" y="869" font-size="12" class="t2">100%</text><path d="M134 864h12M140 858v12" class="ico"/>
  <path d="M164 858h-6v6M180 870h6v-6" class="ico"/><path d="M204 858l10 12M214 858l-10 12" class="ico" stroke-width="1.3"/><circle cx="242" cy="864" r="6" class="ico"/>
  <g filter="url(#card)"><rect x="1250" y="760" width="170" height="118" rx="14" fill="rgba(252,252,253,0.94)"/></g>
  <rect x="1270" y="782" width="34" height="18" rx="4" fill="rgba(0,122,255,0.35)"/><rect x="1316" y="782" width="34" height="18" rx="4" fill="#d1d1d6"/>
  <rect x="1270" y="816" width="34" height="18" rx="4" fill="#d1d1d6"/><rect x="1316" y="816" width="34" height="18" rx="4" fill="#d1d1d6"/>
  <rect x="1362" y="830" width="26" height="18" rx="4" fill="#fde68a"/>
  <rect x="1262" y="774" width="130" height="84" rx="6" fill="none" stroke="#007aff" stroke-width="1.5"/>
</svg>
