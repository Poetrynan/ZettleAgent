<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="FSRS-4.5 spaced repetition review: one card with its answer revealed and four grade buttons">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1d1d1f; }
      .t2 { fill: #5c5c61; } .t3 { fill: #8e8e93; } .acc { fill: #007aff; } .b { font-weight: 600; } .bb { font-weight: 700; }
      .disp { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .hair { stroke: rgba(0,0,0,0.1); stroke-width: 1; fill: none; }
    </style>
    <filter id="win" x="-6%" y="-6%" width="112%" height="118%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.15"/></filter>
    <filter id="card" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.09"/></filter>
  </defs>

  <g filter="url(#win)"><rect x="30" y="24" width="1140" height="700" rx="14" fill="#ffffff"/></g>
  <rect x="30.5" y="24.5" width="1139" height="699" rx="14" class="hair"/>
  <rect x="30" y="24" width="1140" height="46" rx="14" fill="#f5f5f7"/><rect x="30" y="54" width="1140" height="16" fill="#f5f5f7"/>
  <path d="M30 70h1140" class="hair"/>
  <circle cx="54" cy="47" r="6.5" fill="#ff5f57"/><circle cx="76" cy="47" r="6.5" fill="#febc2e"/><circle cx="98" cy="47" r="6.5" fill="#28c840"/>
  <text x="600" y="52" text-anchor="middle" font-size="13.5" class="bb">Review</text>

  <!-- Status row -->
  <text x="70" y="108" font-size="13" class="t2">Card <tspan class="b" style="fill:#1d1d1f">3</tspan> of 7 · due today</text>
  <rect x="70" y="120" width="1060" height="4" rx="2" fill="rgba(0,0,0,0.07)"/><rect x="70" y="120" width="303" height="4" rx="2" fill="#007aff"/>
  <text x="1130" y="108" text-anchor="end" font-size="13" class="t2">Retention target 90% · stability 12.4 d</text>

  <!-- Card -->
  <g filter="url(#card)"><rect x="200" y="160" width="800" height="340" rx="20" fill="#ffffff"/></g>
  <rect x="200.5" y="160.5" width="799" height="339" rx="20" class="hair"/>
  <text x="600" y="198" text-anchor="middle" font-size="12.5" class="t3">Vault › research-method · reps 4</text>
  <text x="600" y="252" text-anchor="middle" font-size="26" class="disp bb">Why does ZettleAgent ask for a</text>
  <text x="600" y="286" text-anchor="middle" font-size="26" class="disp bb">ReadyWrite token before editing a note?</text>
  <path d="M260 318h680" class="hair"/>
  <text x="600" y="358" text-anchor="middle" font-size="16" class="t2">Your Markdown files belong to you. The Agent stages each change</text>
  <text x="600" y="382" text-anchor="middle" font-size="16" class="t2">as a line diff and only writes after you approve it.</text>
  <rect x="534" y="410" width="132" height="26" rx="8" fill="#f5f5f7"/><text x="600" y="428" text-anchor="middle" font-size="12.5" class="mono t2">ReadyWriteToken</text>

  <!-- Grades -->
  <g font-size="15">
    <rect x="200" y="540" width="188" height="74" rx="16" fill="#f5f5f7"/>
    <text x="294" y="572" text-anchor="middle" class="b">Again</text><text x="294" y="596" text-anchor="middle" font-size="13" class="t3">10 min</text>
    <rect x="404" y="540" width="188" height="74" rx="16" fill="#f5f5f7"/>
    <text x="498" y="572" text-anchor="middle" class="b">Hard</text><text x="498" y="596" text-anchor="middle" font-size="13" class="t3">1 day</text>
    <rect x="608" y="540" width="188" height="74" rx="16" fill="#007aff"/>
    <text x="702" y="572" text-anchor="middle" class="b" style="fill:#fff">Good</text><text x="702" y="596" text-anchor="middle" font-size="13" style="fill:rgba(255,255,255,0.85)">4 days</text>
    <rect x="812" y="540" width="188" height="74" rx="16" fill="#f5f5f7"/>
    <text x="906" y="572" text-anchor="middle" class="b">Easy</text><text x="906" y="596" text-anchor="middle" font-size="13" class="t3">9 days</text>
  </g>

  <text x="600" y="660" text-anchor="middle" font-size="13" class="t3">Space to reveal · 1 – 4 to grade · intervals from FSRS-4.5</text>
</svg>
