  <text x="1331" y="97" font-size="11" class="b">Agent</text><text x="1385" y="97" font-size="11" class="t2">RAG</text>

  <rect x="1186" y="132" width="240" height="56" rx="18" fill="#ebebee"/>
  <text x="1200" y="155" font-size="13">Which sources back the WriteGuard</text>
  <text x="1200" y="174" font-size="13">claim? Fix the orphan if needed.</text>

  <rect x="1126" y="204" width="18" height="18" rx="6" fill="rgba(0,122,255,0.12)"/><path d="M1135 207.5l1.4 3.6 3.6 1.4-3.6 1.4-1.4 3.6-1.4-3.6-3.6-1.4 3.6-1.4z" fill="#007aff"/>
  <text x="1152" y="217" font-size="12" class="t2 b">Assistant</text>
  <rect x="1126" y="232" width="190" height="26" rx="13" fill="#f5f5f7"/>
  <text x="1140" y="249" font-size="12" class="t2">Thought through 4 steps  ›</text>
  <path d="M1136 270v66" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>
  <g font-size="12" class="t2">
    <circle cx="1154" cy="280" r="6" fill="rgba(40,167,69,0.16)"/><path d="M1151.5 280l1.8 1.8 3.2-3.4" stroke="#28a745" stroke-width="1.4" fill="none"/><text x="1168" y="284">Scoped 4 related notes</text>
    <circle cx="1154" cy="302" r="6" fill="rgba(40,167,69,0.16)"/><path d="M1151.5 302l1.8 1.8 3.2-3.4" stroke="#28a745" stroke-width="1.4" fill="none"/><text x="1168" y="306">graph_blind_spot_detect · 42 ms</text>
    <circle cx="1154" cy="324" r="6" fill="rgba(40,167,69,0.16)"/><path d="M1151.5 324l1.8 1.8 3.2-3.4" stroke="#28a745" stroke-width="1.4" fill="none"/><text x="1168" y="328">Found 1 orphan: Keyring Substrate</text>
  </g>
  <text x="1126" y="364" font-size="13.5">Three notes support the claim. I prepared</text>
  <text x="1126" y="384" font-size="13.5">a bridge link for <tspan class="acc">[[Keyring Substrate]]</tspan> —</text>
  <text x="1126" y="404" font-size="13.5">it waits for your approval.</text>

  <!-- Write gate -->
  <rect x="1126" y="422" width="298" height="210" rx="14" fill="rgba(232,137,12,0.08)"/>
  <rect x="1140" y="436" width="98" height="20" rx="10" fill="rgba(232,137,12,0.16)"/><text x="1150" y="450" font-size="11" style="fill:#b35a00" class="b">Pending write</text>
  <text x="1140" y="478" font-size="12" class="t2">Vault › research-method · L42</text>
  <rect x="1140" y="490" width="270" height="26" rx="8" fill="rgba(255,59,48,0.1)"/>
  <text x="1150" y="507" font-size="11.5" class="mono" style="fill:#c7261c">− Draft claim without citations.</text>
  <rect x="1140" y="522" width="270" height="26" rx="8" fill="rgba(40,167,69,0.12)"/>
  <text x="1150" y="539" font-size="11.5" class="mono" style="fill:#1a7f3a">+ Verified claim, see [[Zettelkasten]].</text>
  <rect x="1140" y="576" width="148" height="32" rx="16" fill="#007aff"/><text x="1171" y="597" font-size="13" class="b" style="fill:#fff">Approve write</text>
  <rect x="1298" y="576" width="96" height="32" rx="16" fill="#fff" filter="url(#card)"/><text x="1324" y="597" font-size="13" class="b">Reject</text>

