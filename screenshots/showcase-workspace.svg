  <text x="1140" y="815" font-size="13" class="t3">Ask about this route…</text>
  <rect x="1138" y="830" width="56" height="22" rx="11" fill="none" stroke="rgba(0,0,0,0.1)"/><text x="1152" y="845" font-size="11" class="t2">Web</text>
  <rect x="1200" y="830" width="84" height="22" rx="11" fill="none" stroke="rgba(0,0,0,0.1)"/><text x="1212" y="845" font-size="11" class="t2">Agent mode</text>
  <circle cx="1400" cy="841" r="14" fill="#007aff"/><path d="M1400 847v-11M1395 840.5l5-5 5 5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1132" cy="881" r="3" fill="#28a745"/><text x="1140" y="885" font-size="11" class="t3">Vault · Agent mode · context 18%</text>
