  <path d="M426 862h16" stroke="#af52de" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="4 4"/><text x="448" y="866" font-size="12" class="t2">Semantic</text>
  <g filter="url(#pop)"><rect x="1048" y="846" width="38" height="32" rx="16" fill="rgba(252,252,253,0.92)"/></g>
  <circle cx="1067" cy="862" r="6.5" class="ico"/><path d="M1067 859.5v1M1067 862.5v3" class="ico"/>

