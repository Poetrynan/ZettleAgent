  <g filter="url(#pop)"><rect x="326" y="128" width="226" height="30" rx="15" fill="rgba(252,252,253,0.92)"/></g>
  <text x="342" y="148" font-size="12.5" class="t2"><tspan class="b" style="fill:#1d1d1f">1,420</tspan> notes · <tspan class="b" style="fill:#1d1d1f">3,908</tspan> links</text>
  <g filter="url(#pop)"><rect x="600" y="128" width="210" height="30" rx="15" fill="rgba(252,252,253,0.92)"/></g>
  <circle cx="616" cy="143" r="5" class="ico"/><path d="M616 140v3l2 1.5" class="ico"/>
  <rect x="630" y="141" width="120" height="4" rx="2" fill="rgba(0,0,0,0.08)"/><rect x="630" y="141" width="96" height="4" rx="2" fill="#007aff"/>
  <circle cx="726" cy="143" r="6" fill="#fff" stroke="rgba(0,0,0,0.15)"/>
