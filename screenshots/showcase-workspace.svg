<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="940" viewBox="0 0 1480 940" role="img" aria-label="ZettleAgent workspace: activity rail, explorer, knowledge graph and the chat inspector with a pending write">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1d1d1f; }
      .t2 { fill: #5c5c61; } .t3 { fill: #8e8e93; } .acc { fill: #007aff; } .b { font-weight: 600; } .bb { font-weight: 700; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .hair { stroke: rgba(0,0,0,0.1); stroke-width: 1; fill: none; }
      .ico { fill: none; stroke: #5c5c61; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ico-acc { fill: none; stroke: #007aff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="win" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.16"/></filter>
    <filter id="card" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.08"/></filter>
    <filter id="pop" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity="0.1"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(0,0,0,0.09)"/></pattern>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#007aff" stop-opacity="0"/><stop offset="0.45" stop-color="#007aff"/><stop offset="0.75" stop-color="#af52de"/><stop offset="1" stop-color="#af52de" stop-opacity="0"/></linearGradient>
  </defs>

  <!-- Window -->
  <g filter="url(#win)"><rect x="30" y="24" width="1420" height="880" rx="14" fill="#f5f5f7"/></g>
  <rect x="30.5" y="24.5" width="1419" height="879" rx="14" class="hair"/>

  <!-- Title bar: traffic lights, view title, command center -->
  <circle cx="54" cy="46" r="6.5" fill="#ff5f57"/><circle cx="76" cy="46" r="6.5" fill="#febc2e"/><circle cx="98" cy="46" r="6.5" fill="#28c840"/>
  <rect x="560" y="33" width="360" height="26" rx="13" fill="rgba(0,0,0,0.05)" stroke="rgba(0,0,0,0.08)"/>
