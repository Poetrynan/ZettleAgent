  <circle cx="960" cy="330" r="7" fill="#8e8e93" stroke="#fff" stroke-width="2"/>
  <circle cx="440" cy="300" r="7" fill="#8e8e93" stroke="#fff" stroke-width="2"/>
  <circle cx="480" cy="760" r="7" fill="#8e8e93" stroke="#fff" stroke-width="2"/>
  <circle cx="1010" cy="760" r="7" fill="#8e8e93" stroke="#fff" stroke-width="2"/>
