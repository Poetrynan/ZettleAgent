  <g transform="translate(230 82)"><path d="M3 2h6l3 3v9H3z" class="ico"/><path d="M7.5 7v5M5 9.5h5" class="ico"/></g>
  <g transform="translate(252 82)"><path d="M2 4h5l1.5 2H14v8H2z" class="ico"/></g>
  <g transform="translate(274 82)"><path d="M3 4l5-2 5 2M8 2v9M4 14h8" class="ico"/></g>
  <rect x="92" y="104" width="206" height="28" rx="14" fill="rgba(0,0,0,0.055)"/>
  <circle cx="110" cy="117" r="4.5" class="ico"/><path d="M113.5 120.5l3 3" class="ico"/>
  <text x="124" y="122" font-size="12.5" class="t3">Search notes…</text>

  <rect x="92" y="144" width="206" height="214" rx="12" fill="rgba(0,0,0,0.03)"/>
  <path d="M104 160h7l2 2h8v8h-17z" class="ico-acc"/><text x="128" y="169" font-size="12.5" class="b">Vault</text><text x="282" y="169" font-size="11.5" class="t3">6</text>
  <g font-size="13">
