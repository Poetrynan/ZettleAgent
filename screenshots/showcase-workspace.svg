    <rect x="458" y="342" width="124" height="24" rx="12" fill="rgba(252,252,253,0.95)" stroke="rgba(0,0,0,0.08)"/><text x="470" y="358">Note Mutation</text>
    <rect x="806" y="378" width="140" height="24" rx="12" fill="rgba(252,252,253,0.95)" stroke="rgba(175,82,222,0.4)"/><text x="818" y="394">WriteGuard · focus</text>
    <rect x="536" y="712" width="114" height="24" rx="12" fill="rgba(252,252,253,0.95)" stroke="rgba(0,0,0,0.08)"/><text x="548" y="728">Spatial Canvas</text>
    <rect x="856" y="682" width="98" height="24" rx="12" fill="rgba(252,252,253,0.95)" stroke="rgba(0,0,0,0.08)"/><text x="868" y="698">FSRS Review</text>
  </g>

