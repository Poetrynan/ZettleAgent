    <path d="M106 245h9l3 3v9h-12z" class="ico-acc"/><text x="128" y="256">local-graph</text>
    <path d="M106 274h9l3 3v9h-12z" class="ico-acc"/><text x="128" y="285">open-claims</text>
    <path d="M106 303h9l3 3v9h-12z" class="ico-acc"/><text x="128" y="314">WriteGuard Protocol</text>
    <path d="M106 332h9l3 3v9h-12z" class="ico-acc"/><text x="128" y="343">Data Sovereignty</text>
