    <rect x="0" y="0" width="34" height="32" rx="8" fill="none"/>
    <path d="M10 22v-7M17 22v-12M24 22v-4" class="ico"/>
    <g transform="translate(0 38)"><rect x="0" y="0" width="34" height="32" rx="8" fill="none"/><path d="M12 8h7l4 4v12H12z" class="ico"/></g>
    <g transform="translate(0 76)"><rect x="10" y="9" width="14" height="14" rx="2.5" class="ico"/><path d="M10 13h14" class="ico"/></g>
    <path d="M9 124h16" class="hair"/>
    <g transform="translate(0 132)"><rect x="0" y="0" width="34" height="32" rx="8" fill="rgba(0,0,0,0.085)"/><circle cx="17" cy="10" r="2.6" class="ico-acc"/><circle cx="10" cy="22" r="2.6" class="ico-acc"/><circle cx="24" cy="22" r="2.6" class="ico-acc"/><path d="M15.5 12l-4 7.5M18.5 12l4 7.5" class="ico-acc"/></g>
    <g transform="translate(0 170)"><path d="M17 8l8 4.5-8 4.5-8-4.5zM9 17l8 4.5 8-4.5" class="ico"/></g>
    <g transform="translate(0 208)"><rect x="9" y="8" width="16" height="7" rx="2" class="ico"/><rect x="9" y="18" width="16" height="7" rx="2" class="ico"/></g>
    <path d="M9 248h16" class="hair"/>
    <g transform="translate(0 256)"><circle cx="17" cy="16" r="7.5" class="ico"/><path d="M17 9v14" class="ico"/></g>
    <g transform="translate(0 294)"><ellipse cx="17" cy="10" rx="7" ry="2.8" class="ico"/><path d="M10 10v12c0 1.6 3.1 2.8 7 2.8s7-1.2 7-2.8V10M10 16c0 1.6 3.1 2.8 7 2.8s7-1.2 7-2.8" class="ico"/></g>
    <g transform="translate(0 788)"><circle cx="17" cy="16" r="3" class="ico"/><circle cx="17" cy="16" r="7.5" class="ico" stroke-dasharray="3 2.6"/></g>
  </g>

