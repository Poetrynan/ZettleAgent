<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="940" viewBox="0 0 1480 940" role="img" aria-label="WriteGuard line-diff approval in the chat, and the reversible change history in the Knowledge Center">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1d1d1f; }
      .t2 { fill: #5c5c61; } .t3 { fill: #8e8e93; } .acc { fill: #007aff; } .b { font-weight: 600; } .bb { font-weight: 700; }
      .disp { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .hair { stroke: rgba(0,0,0,0.1); stroke-width: 1; fill: none; }
      .ico { fill: none; stroke: #5c5c61; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="win" x="-6%" y="-6%" width="112%" height="116%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.15"/></filter>
    <filter id="ctl" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.7" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>

  <!-- Left window: approval in chat -->
  <g filter="url(#win)"><rect x="30" y="30" width="700" height="860" rx="14" fill="#ffffff"/></g>
  <rect x="30.5" y="30.5" width="699" height="859" rx="14" class="hair"/>
  <rect x="30" y="30" width="700" height="52" rx="14" fill="#f5f5f7"/><rect x="30" y="66" width="700" height="16" fill="#f5f5f7"/>
  <path d="M30 82h700" class="hair"/>
  <circle cx="54" cy="56" r="6.5" fill="#ff5f57"/><circle cx="76" cy="56" r="6.5" fill="#febc2e"/><circle cx="98" cy="56" r="6.5" fill="#28c840"/>
  <text x="380" y="61" text-anchor="middle" font-size="13.5" class="bb">Assistant · proposed write</text>

  <text x="66" y="132" font-size="26" class="disp bb">Review a proposed change.</text>
  <text x="66" y="162" font-size="15" class="t2">Inspect the proposed diff before accepting an edit.</text>
  <text x="66" y="182" font-size="15" class="t2">Approval requirements follow your permission settings.</text>

  <!-- Decision card -->
  <rect x="66" y="210" width="628" height="430" rx="14" fill="#ffffff" stroke="rgba(0,0,0,0.1)"/>
  <rect x="86" y="230" width="104" height="22" rx="11" fill="rgba(232,137,12,0.14)"/><text x="98" y="245" font-size="11.5" class="b" style="fill:#b35a00">Pending write</text>
  <text x="202" y="246" font-size="12.5" class="t3">edit_note · risk: medium</text>
  <path d="M90 270h10l4 4v12H90z" class="ico" stroke="#007aff"/>
  <text x="114" y="284" font-size="13.5" class="b">Vault › research-method</text><text x="676" y="284" text-anchor="end" font-size="12.5" class="t3">lines 42 – 49</text>

  <g class="mono" font-size="13">
    <rect x="86" y="304" width="588" height="34" rx="9" fill="rgba(255,59,48,0.09)"/>
    <text x="100" y="326" class="t3">42</text><text x="130" y="326" style="fill:#c7261c">−  The model can overwrite files directly without review.</text>
    <rect x="86" y="344" width="588" height="34" rx="9" fill="rgba(40,167,69,0.11)"/>
    <text x="100" y="366" class="t3">42</text><text x="130" y="366" style="fill:#1a7f3a">+  This proposed edit requires your approval.</text>
    <rect x="86" y="384" width="588" height="34" rx="9" fill="rgba(40,167,69,0.11)"/>
    <text x="100" y="406" class="t3">43</text><text x="130" y="406" style="fill:#1a7f3a">+  See [[Zettelkasten#L14]] and [[Security Keyring]].</text>
  </g>

  <g font-size="14">
    <rect x="88" y="442" width="18" height="18" rx="5" fill="#007aff"/><path d="M92 451l3 3 6-6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="118" y="456">Patch 1 — add the verification citation</text>
    <rect x="88" y="474" width="18" height="18" rx="5" fill="#007aff"/><path d="M92 483l3 3 6-6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="118" y="488">Patch 2 — link the keyring note</text>
  </g>

  <rect x="86" y="520" width="226" height="38" rx="19" fill="#007aff"/><text x="199" y="544" text-anchor="middle" font-size="14" class="b" style="fill:#fff">Approve 2 lines</text>
  <g filter="url(#ctl)"><rect x="324" y="520" width="112" height="38" rx="19" fill="#ffffff"/></g><text x="380" y="544" text-anchor="middle" font-size="14" class="b">Reject all</text>
  <text x="456" y="544" font-size="13" class="t3">or edit before approving</text>

  <rect x="86" y="578" width="588" height="46" rx="12" fill="#f5f5f7"/>
  <circle cx="108" cy="601" r="8" fill="none" stroke="#007aff" stroke-width="1.6"/><path d="M108 597v5M108 605v.5" stroke="#007aff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="126" y="606" font-size="13" class="t2">Check permission settings before enabling automatic writes.</text>

  <!-- Composer stub -->
  <rect x="66" y="772" width="628" height="78" rx="20" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="88" y="802" font-size="14" class="t3">Ask a follow-up…</text>
  <rect x="86" y="816" width="60" height="22" rx="11" fill="none" stroke="rgba(0,0,0,0.1)"/><text x="101" y="831" font-size="11.5" class="t2">Web</text>
  <rect x="152" y="816" width="92" height="22" rx="11" fill="none" stroke="rgba(0,0,0,0.1)"/><text x="165" y="831" font-size="11.5" class="t2">Agent mode</text>
  <circle cx="664" cy="827" r="15" fill="#ebebee"/><path d="M664 833v-11M659 826.5l5-5 5 5" stroke="#b8b8bd" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right window: change history -->
  <g filter="url(#win)"><rect x="760" y="30" width="690" height="860" rx="14" fill="#f5f5f7"/></g>
  <rect x="760.5" y="30.5" width="689" height="859" rx="14" class="hair"/>
  <circle cx="784" cy="56" r="6.5" fill="#ff5f57"/><circle cx="806" cy="56" r="6.5" fill="#febc2e"/><circle cx="828" cy="56" r="6.5" fill="#28c840"/>
  <text x="1105" y="61" text-anchor="middle" font-size="13.5" class="bb">Knowledge Center</text>

  <!-- KC nav -->
  <g font-size="13">
    <rect x="776" y="96" width="172" height="30" rx="8" fill="none"/><text x="790" y="116">Inbox</text><text x="934" y="116" text-anchor="end" font-size="12" class="t3">12</text>
    <text x="790" y="148">Memory</text><text x="934" y="148" text-anchor="end" font-size="12" class="t3">47</text>
    <rect x="776" y="160" width="172" height="30" rx="8" fill="rgba(0,0,0,0.085)"/><text x="790" y="180" class="b">Changes</text><text x="934" y="180" text-anchor="end" font-size="12" class="t3">3</text>
    <text x="790" y="212">Tasks</text><text x="934" y="212" text-anchor="end" font-size="12" class="t3">8</text>
    <text x="790" y="244">Health</text><text x="934" y="244" text-anchor="end" font-size="12" class="t3">2</text>
    <text x="790" y="276">Activity</text>
  </g>

  <rect x="960" y="88" width="478" height="790" rx="14" fill="#ffffff" stroke="rgba(0,0,0,0.1)"/>
  <text x="986" y="128" font-size="22" class="disp bb">Change history</text>
  <text x="986" y="152" font-size="13.5" class="t2">Inspect recorded changes before choosing Undo.</text>

  <rect x="980" y="176" width="438" height="128" rx="14" fill="#f5f5f7"/>
  <rect x="996" y="192" width="44" height="20" rx="10" fill="rgba(0,122,255,0.12)"/><text x="1006" y="206" font-size="11" class="b acc">HEAD</text>
  <text x="1050" y="207" font-size="12" class="t3">2 min ago · Agent turn 14</text>
  <text x="996" y="236" font-size="14.5" class="b">Added 3 cards to “Concept Map”</text>
  <text x="996" y="257" font-size="12.5" class="t2">3 canvas nodes · 2 edges recorded</text>
  <g filter="url(#ctl)"><rect x="996" y="270" width="92" height="24" rx="12" fill="#ffffff"/></g>
  <path d="M1010 282a5 5 0 1 0 1.5-3.6M1010 277v3.6h3.6" class="ico"/><text x="1026" y="286" font-size="12" class="b">Undo</text>

  <rect x="980" y="316" width="438" height="128" rx="14" fill="#f5f5f7"/>
  <text x="996" y="347" font-size="12" class="t3">1 hour ago · Batch Agent</text>
  <text x="996" y="376" font-size="14.5" class="b">Linked 14 notes to the MOC index</text>
  <text x="996" y="397" font-size="12.5" class="t2">14 two-way wikilinks across the vault</text>
  <g filter="url(#ctl)"><rect x="996" y="410" width="118" height="24" rx="12" fill="#ffffff"/></g>
  <path d="M1010 422a5 5 0 1 0 1.5-3.6M1010 417v3.6h3.6" class="ico"/><text x="1026" y="426" font-size="12" class="b">Revert batch</text>

  <rect x="980" y="456" width="438" height="108" rx="14" fill="#f5f5f7"/>
  <rect x="996" y="472" width="74" height="20" rx="10" fill="rgba(40,167,69,0.14)"/><text x="1007" y="486" font-size="11" class="b" style="fill:#1a7f3a">Reverted</text>
  <text x="1080" y="487" font-size="12" class="t3">Yesterday</text>
  <text x="996" y="516" font-size="14.5" class="b">Rewrote the “Methods” heading</text>
  <text x="996" y="540" font-size="12.5" class="t2">Original text restored exactly</text>

  <rect x="980" y="590" width="438" height="86" rx="14" fill="rgba(0,122,255,0.07)"/>
  <text x="996" y="622" font-size="13.5" class="b">Undo respects later edits</text>
  <text x="996" y="644" font-size="12.5" class="t2">Recorded changes can be restored when the current content</text>
  <text x="996" y="662" font-size="12.5" class="t2">still matches. Conflicting later edits can block an undo.</text>
<text x="1430" y="925" text-anchor="end" font-size="11" class="t3">v0.3.0 · Interface illustration · sample data</text>
</svg>
