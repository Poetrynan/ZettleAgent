<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="ZettelAgent — a knowledge-management AI Agent / IDE">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1d1d1f; }
      .t2 { fill: #5c5c61; } .t3 { fill: #8e8e93; } .b { font-weight: 600; } .bb { font-weight: 700; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .hair { stroke: rgba(0,0,0,0.1); stroke-width: 1; fill: none; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8f7f3"/><stop offset="1" stop-color="#efede7"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAF8F3"/><stop offset="1" stop-color="#EFEBE3"/></linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.30  0 0 0 0 0.24  0 0 0 0.06 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <filter id="press" x="-10%" y="-10%" width="120%" height="120%"><feOffset in="SourceAlpha" dx="0" dy="5" result="off"/><feGaussianBlur in="off" stdDeviation="4" result="blur"/><feComposite in="SourceAlpha" in2="blur" operator="arithmetic" k2="1" k3="-1" result="inner"/><feFlood flood-color="#000" flood-opacity="0.45"/><feComposite in2="inner" operator="in" result="innerShadow"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="innerShadow"/></feMerge></filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="sm" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="1600" height="640" rx="28" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1599" height="639" rx="28" fill="none" stroke="rgba(0,0,0,0.06)"/>

  <!-- App icon (same artwork as logo/zettleagent-icon.svg): ink Z through three notes on paper -->
  <g transform="translate(110 150) scale(0.21845) translate(-100 -100)">
    <g filter="url(#sh)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)"/></g>
    <g clip-path="url(#body)"><rect x="100" y="100" width="824" height="824" fill="#fff" filter="url(#grain)"/></g>
    <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="3"/>
    <g filter="url(#press)">
      <path d="M318 330 H706 L318 694 H706" fill="none" stroke="#1C1B19" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="318" cy="330" r="62" fill="#1C1B19"/><circle cx="706" cy="694" r="62" fill="#1C1B19"/>
      <circle cx="512" cy="512" r="62" fill="#C8432B"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="330" y="236" font-size="92" class="bb" letter-spacing="-3">Zettel<tspan fill="#6b6862">Agent</tspan></text>
  <text x="334" y="290" font-size="30" class="t2 b">An AI Agent / IDE for your knowledge.</text>
  <g class="txt" font-size="16">
    <rect x="334" y="322" width="170" height="34" rx="17" fill="#fff" filter="url(#sm)"/><circle cx="354" cy="339" r="5" fill="#3d7a4a"/><text x="368" y="345" class="b">Local Markdown</text>
    <rect x="514" y="322" width="180" height="34" rx="17" fill="#fff" filter="url(#sm)"/><circle cx="534" cy="339" r="5" fill="#1c1b19"/><text x="548" y="345" class="b">Visible evidence</text>
    <rect x="704" y="322" width="184" height="34" rx="17" fill="#fff" filter="url(#sm)"/><circle cx="724" cy="339" r="5" fill="#C8432B"/><text x="738" y="345" class="b">Review changes</text>
  </g>
  <text x="334" y="420" font-size="16" class="txt t3">Local Markdown · Jina embeddings · Canvas · FSRS review</text>

  <!-- Mini window -->
  <g transform="translate(1000 110)">
    <g filter="url(#sh)"><rect width="500" height="420" rx="16" fill="#f5f5f7"/></g>
    <rect x="0.5" y="0.5" width="499" height="419" rx="16" class="hair"/>
    <circle cx="22" cy="22" r="6" fill="#ff5f57"/><circle cx="42" cy="22" r="6" fill="#febc2e"/><circle cx="62" cy="22" r="6" fill="#28c840"/>
    <rect x="150" y="12" width="200" height="20" rx="10" fill="rgba(0,0,0,0.05)"/><text x="250" y="26" text-anchor="middle" font-size="11" class="txt t3">Search notes or commands</text>
    <!-- rail -->
    <g fill="none" stroke="#8e8e93" stroke-width="1.6" stroke-linecap="round">
      <rect x="14" y="54" width="24" height="22" rx="6" fill="rgba(0,0,0,0.08)" stroke="none"/>
      <path d="M21 70v-6M26 70v-10M31 70v-4" stroke="#007aff"/>
      <path d="M21 90h6l3 3v8h-9z"/><rect x="20" y="118" width="12" height="11" rx="2"/>
      <circle cx="26" cy="152" r="5"/><path d="M20 180l6-4 6 4-6 4z"/>
    </g>
    <!-- graph panel -->
    <rect x="52" y="44" width="250" height="364" rx="12" fill="#fff" stroke="rgba(0,0,0,0.08)"/>
    <g fill="none" stroke="rgba(0,122,255,0.5)" stroke-width="1.6">
      <path d="M176 220 L110 140"/><path d="M176 220 L250 150"/><path d="M176 220 L120 320"/><path d="M176 220 L262 300"/>
      <path d="M250 150 L276 96" stroke="rgba(200,67,43,0.6)" stroke-dasharray="4 4"/>
    </g>
    <circle cx="176" cy="220" r="30" fill="rgba(0,122,255,0.1)"/>
    <circle cx="176" cy="220" r="12" fill="#007aff" stroke="#fff" stroke-width="2.5"/>
    <circle cx="110" cy="140" r="7" fill="#34c759" stroke="#fff" stroke-width="2"/>
    <circle cx="250" cy="150" r="8" fill="#C8432B" stroke="#fff" stroke-width="2"/>
    <circle cx="120" cy="320" r="7" fill="#ff9500" stroke="#fff" stroke-width="2"/>
    <circle cx="262" cy="300" r="7" fill="#8e8e93" stroke="#fff" stroke-width="2"/>
    <circle cx="276" cy="96" r="5" fill="#8e8e93"/>
    <!-- chat panel -->
    <rect x="310" y="44" width="178" height="364" rx="12" fill="#fff" stroke="rgba(0,0,0,0.08)"/>
    <rect x="356" y="62" width="120" height="40" rx="14" fill="#ebebee"/>
    <rect x="368" y="76" width="92" height="5" rx="2.5" fill="#b8b8bd"/><rect x="368" y="86" width="64" height="5" rx="2.5" fill="#b8b8bd"/>
    <rect x="322" y="116" width="14" height="14" rx="4" fill="rgba(0,122,255,0.14)"/>
    <rect x="342" y="120" width="56" height="6" rx="3" fill="#c7c7cc"/>
    <rect x="322" y="142" width="150" height="5" rx="2.5" fill="#d1d1d6"/><rect x="322" y="154" width="138" height="5" rx="2.5" fill="#d1d1d6"/><rect x="322" y="166" width="104" height="5" rx="2.5" fill="#d1d1d6"/>
    <rect x="322" y="186" width="154" height="92" rx="12" fill="rgba(232,137,12,0.1)"/>
    <rect x="332" y="198" width="58" height="12" rx="6" fill="rgba(232,137,12,0.25)"/>
    <rect x="332" y="218" width="134" height="12" rx="4" fill="rgba(255,59,48,0.14)"/>
    <rect x="332" y="236" width="134" height="12" rx="4" fill="rgba(40,167,69,0.16)"/>
    <rect x="332" y="256" width="62" height="14" rx="7" fill="#007aff"/>
    <rect x="320" y="352" width="158" height="44" rx="16" fill="#fff" stroke="#007aff" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="332" y="364" width="80" height="6" rx="3" fill="#d1d1d6"/>
    <circle cx="462" cy="374" r="10" fill="#007aff"/>
  </g>
<text x="110" y="596" font-size="16" class="txt t2">ZettelAgent v0.3.0 · Notes, retrieval, and an Agent in one workbench.</text>
  <text x="1490" y="614" text-anchor="end" font-size="11" class="txt t3">Interface illustration · sample data</text>
</svg>
