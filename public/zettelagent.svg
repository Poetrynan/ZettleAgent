<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="ZettleAgent">
  <!--
    ZettleAgent app icon.
    A single ink "Z" drawn as one line of thought through three linked notes,
    pressed into warm paper. The middle note — where the idea turns — is the
    only colour. macOS grid: 1024 canvas, 824 body, 100 margin.
  -->
  <defs>
    <!-- Paper: barely-there top-to-bottom light falloff, no hue shift -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF8F3"/>
      <stop offset="1" stop-color="#EFEBE3"/>
    </linearGradient>

    <!-- Fine paper grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.30  0 0 0 0 0.24  0 0 0 0.06 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Soft cast shadow of the tile -->
    <filter id="tile" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/>
    </filter>

    <!-- Letterpress: ink sits slightly below the paper (inner shadow on top edge,
         faint highlight on the bottom edge) -->
    <filter id="press" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset in="SourceAlpha" dx="0" dy="5" result="off"/>
      <feGaussianBlur in="off" stdDeviation="4" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="arithmetic" k2="1" k3="-1" result="inner"/>
      <feFlood flood-color="#000" flood-opacity="0.45"/>
      <feComposite in2="inner" operator="in" result="innerShadow"/>
      <feOffset in="SourceAlpha" dx="0" dy="-2" result="up"/>
      <feComposite in="up" in2="SourceAlpha" operator="out" result="rim"/>
      <feFlood flood-color="#fff" flood-opacity="0.0"/>
      <feComposite in2="rim" operator="in" result="rimLight"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="innerShadow"/>
      </feMerge>
    </filter>

    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#fff" flood-opacity="0.9"/>
    </filter>

    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- Tile -->
  <g filter="url(#tile)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="#fff" filter="url(#grain)"/>
  </g>
  <!-- Edge: hairline + top highlight, like a sheet with a slight bevel -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="3" clip-path="url(#body)" stroke-dasharray="1400 4000" stroke-dashoffset="-120"/>

  <!-- The Z: one continuous stroke -->
  <g filter="url(#lift)">
    <g filter="url(#press)">
      <path d="M318 330 H706 L318 694 H706" fill="none" stroke="#1C1B19" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Three linked notes -->
      <circle cx="318" cy="330" r="62" fill="#1C1B19"/>
      <circle cx="706" cy="694" r="62" fill="#1C1B19"/>
      <circle cx="512" cy="512" r="62" fill="#C8432B"/>
    </g>
  </g>
</svg>
