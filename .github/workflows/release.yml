name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.2). Must already exist.'
        required: true
        type: string

permissions:
  contents: write

# One release run per tag. A re-push of the same tag cancels the stale run
# instead of racing it and uploading half the matrix twice.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Cheap gate that runs once. Catches the classic "tagged v0.1.2 but the
  # manifests still say 0.1.1" mistake before burning 4 platform builds.
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag and version
        id: resolve
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not semver-shaped (expected vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"    >> "$GITHUB_OUTPUT"

      - name: Assert manifests match the tag
        shell: bash
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')

          echo "tag=$VERSION package.json=$PKG tauri.conf.json=$CONF Cargo.toml=$CARGO"

          FAIL=0
          for pair in "package.json:$PKG" "tauri.conf.json:$CONF" "Cargo.toml:$CARGO"; do
            name="${pair%%:*}"; got="${pair##*:}"
            if [ "$got" != "$VERSION" ]; then
              echo "::error file=$name::$name is $got but the tag says $VERSION"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            os: macos-arm
          - platform: macos-latest
            target: x86_64-apple-darwin
            os: macos-intel
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os: linux

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.tag }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify packaging config
        shell: bash
        run: |
          test -f scripts/download-model.cjs
          test -f scripts/verify-offline-assets.cjs
          grep -q 'build:prod' package.json
          grep -q 'beforeBuildCommand' src-tauri/tauri.conf.json
          grep -q 'build:prod' src-tauri/tauri.conf.json
          test -f src-tauri/resources/ocr_models/det.onnx
          test -f src-tauri/resources/ocr_models/rec.onnx
          ls src-tauri/resources/demo-vault/*.md | head -1

      # Build-time only on CI — fetches embedding models, WASM, fonts, PDF.js.
      # End users never run this step.
      - name: Prepare installer assets
        run: npm run download-model

      - name: Verify offline assets (pre-bundle)
        run: npm run verify-offline

      # Rewrites every vX.Y.Z occurrence in the notes to the tag being shipped,
      # so the notes file never needs a hardcoded version bump. The heredoc
      # delimiter is deliberately unlikely to appear in release prose.
      - name: Load release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ needs.verify-version.outputs.tag }}
        run: |
          NOTES=.github/release-notes/latest.md
          if [ ! -f "$NOTES" ]; then
            echo "::warning::$NOTES missing — releasing with an empty body."
            printf 'body=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY=$(sed -E "s/v[0-9]+\.[0-9]+\.[0-9]+/${TAG}/g" "$NOTES")
          {
            echo "body<<ZETTEL_NOTES_EOF"
            echo "$BODY"
            echo "ZETTEL_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # beforeBuildCommand = download-model + tsc + vite build
      # Vite copies public/ → dist/ (embedding, WASM, fonts, pdf.js)
      # Tauri bundles dist/ + resources/ocr_models + demo-vault into installer.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.verify-version.outputs.tag }}
          releaseName: 'ZettelAgent ${{ needs.verify-version.outputs.tag }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
